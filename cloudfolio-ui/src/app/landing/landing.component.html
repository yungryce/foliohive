<div class="container mx-auto px-4 py-10 bg-[var(--bg)] text-[var(--fg)] transition-colors">
  <div class="max-w-2xl">
    <h1 class="text-3xl font-extrabold tracking-tight mb-2">Cloudfolio</h1>
    <p class="text-sm text-[var(--muted)] mb-6">
      Recruiter view: enter a GitHub username and the skills you’re screening for.
    </p>

    <div class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-5">
      <label class="block text-sm font-medium text-[var(--muted)] mb-1" for="username">GitHub username</label>
      <input
        id="username"
        [(ngModel)]="username"
        placeholder="e.g., octocat"
        class="w-full px-3 py-2 rounded-md border border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] focus:outline-none focus:ring-2 focus:ring-[var(--ring)]"
      />

      <label class="block text-sm font-medium text-[var(--muted)] mt-4 mb-1" for="skills">Skills / keywords</label>
      <input
        id="skills"
        [(ngModel)]="skillsText"
        placeholder="e.g., python, react, kubernetes"
        class="w-full px-3 py-2 rounded-md border border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] focus:outline-none focus:ring-2 focus:ring-[var(--ring)]"
      />

      <label class="block text-sm font-medium text-[var(--muted)] mt-4 mb-1" for="notes">Other inputs</label>
      <textarea
        id="notes"
        [(ngModel)]="notesText"
        rows="3"
        placeholder="Optional notes (role, seniority, domains)…"
        class="w-full px-3 py-2 rounded-md border border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] focus:outline-none focus:ring-2 focus:ring-[var(--ring)]"
      ></textarea>

      <div class="mt-4 flex gap-3 items-center">
        <button
          (click)="start()"
          [disabled]="loading"
          class="px-4 py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] hover:brightness-95"
        >
          {{ loading ? 'Starting…' : 'Refresh candidate + continue' }}
        </button>
        <span class="text-xs text-[var(--muted)]">Uses force refresh.</span>
      </div>

      <p *ngIf="error" class="mt-3 text-sm text-red-500">{{ error }}</p>
    </div>
  </div>
</div>
