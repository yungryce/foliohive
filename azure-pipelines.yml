trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Azure
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''
  location: 'westus2'
  namePrefix: 'cloudfolio'
  tags: '{}'

  # Infra outputs (populated from core deployment)
  appServicePlanId: ''
  functionsSubnetId: ''
  privateEndpointsSubnetId: ''
  storageAccountName: ''
  uamiId: ''
  uamiClientId: ''
  uamiPrincipalId: ''
  appInsightsConnectionString: ''
  privateDnsZoneAzureWebsitesId: ''
  logAnalyticsWorkspaceId: ''
  logAnalyticsWorkspaceKey: ''

  # Artifact storage for Function Apps and SWA
  artifactContainerName: 'function-artifacts'
  swaArtifactContainerName: 'swa-artifacts'

  # Docker Hub
  dockerHubServiceConnection: ''
  dockerHubRepository: ''
  imageTag: '$(Build.BuildId)'

stages:
  # 1) Deploy core infrastructure (includes App Service Plan)
  - template: .ado/infra-core.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      tags: $(tags)

  # 2) CI per function app: build and upload artifacts to Storage
  # CI uses unified parameter files that include both build and deploy config
  - template: .ado/ci-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      storageAccountName: $(storageAccountName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'
      artifactContainerName: $(artifactContainerName)
      functionName: 'api-gateway'
      functionDir: 'api/v0.2.0/api-gateway'
      sharedDir: 'api/v0.2.0/shared'

  - template: .ado/ci-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      storageAccountName: $(storageAccountName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'
      artifactContainerName: $(artifactContainerName)
      functionName: 'sync-worker'
      functionDir: 'api/v0.2.0/sync-worker'
      sharedDir: 'api/v0.2.0/shared'

  - template: .ado/ci-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      storageAccountName: $(storageAccountName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'
      artifactContainerName: $(artifactContainerName)
      functionName: 'merge-worker'
      functionDir: 'api/v0.2.0/merge-worker'
      sharedDir: 'api/v0.2.0/shared'

  # 3) CD per function app: deploy infra + publish artifact from Storage
  # CD uses unified parameter files that include both build and deploy config
  - template: .ado/cd-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      bicepFile: 'infra/bicep/main.function.bicep'
      appServicePlanId: $(appServicePlanId)
      functionsSubnetId: $(functionsSubnetId)
      privateEndpointsSubnetId: $(privateEndpointsSubnetId)
      storageAccountName: $(storageAccountName)
      uamiId: $(uamiId)
      uamiClientId: $(uamiClientId)
      appInsightsConnectionString: $(appInsightsConnectionString)
      privateDnsZoneAzureWebsitesId: $(privateDnsZoneAzureWebsitesId)
      deployPrivateEndpoints: false
      functionName: 'api-gateway'
      functionAppName: '$(namePrefix)-api-gateway'
      artifactContainerName: $(artifactContainerName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'

  - template: .ado/cd-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      bicepFile: 'infra/bicep/main.function.bicep'
      appServicePlanId: $(appServicePlanId)
      functionsSubnetId: $(functionsSubnetId)
      privateEndpointsSubnetId: $(privateEndpointsSubnetId)
      storageAccountName: $(storageAccountName)
      uamiId: $(uamiId)
      uamiClientId: $(uamiClientId)
      appInsightsConnectionString: $(appInsightsConnectionString)
      privateDnsZoneAzureWebsitesId: $(privateDnsZoneAzureWebsitesId)
      deployPrivateEndpoints: false
      functionName: 'sync-worker'
      functionAppName: '$(namePrefix)-sync-worker'
      artifactContainerName: $(artifactContainerName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'

  - template: .ado/cd-function.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      bicepFile: 'infra/bicep/main.function.bicep'
      appServicePlanId: $(appServicePlanId)
      functionsSubnetId: $(functionsSubnetId)
      privateEndpointsSubnetId: $(privateEndpointsSubnetId)
      storageAccountName: $(storageAccountName)
      uamiId: $(uamiId)
      uamiClientId: $(uamiClientId)
      appInsightsConnectionString: $(appInsightsConnectionString)
      privateDnsZoneAzureWebsitesId: $(privateDnsZoneAzureWebsitesId)
      deployPrivateEndpoints: false
      functionName: 'merge-worker'
      functionAppName: '$(namePrefix)-merge-worker'
      artifactContainerName: $(artifactContainerName)
      artifactBuildId: $(Build.BuildId)
      pythonVersion: '3.13'

  # 4) CI for Static Web App: build Angular UI and upload artifact
  - template: .ado/ci-swa.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      storageAccountName: $(storageAccountName)
      artifactBuildId: $(Build.BuildId)
      artifactContainerName: $(swaArtifactContainerName)
      uiDir: 'ui'

  # 5) CI for Container: build and push Docker image
  - template: .ado/ci-container.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      dockerHubServiceConnection: $(dockerHubServiceConnection)
      dockerHubRepository: $(dockerHubRepository)
      imageTag: $(imageTag)
      containerDir: 'api/v0.2.0/training-worker'
      dockerFile: 'api/v0.2.0/training-worker/Dockerfile'

  # 6) CD for Static Web App: deploy infra and publish UI content
  - template: .ado/cd-swa.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      bicepFile: 'infra/bicep/main.staticwebapp.bicep'
      apiGatewayId: $(apiGatewayId)
      apiGatewayDefaultHostname: $(apiGatewayDefaultHostname)
      enableLinkedBackend: false
      storageAccountName: $(storageAccountName)
      artifactContainerName: $(swaArtifactContainerName)
      artifactBuildId: $(Build.BuildId)

  # 7) CD for Container: deploy container infrastructure
  - template: .ado/cd-container.yml
    parameters:
      azureServiceConnection: $(azureServiceConnection)
      subscriptionId: $(subscriptionId)
      resourceGroupName: $(resourceGroupName)
      location: $(location)
      namePrefix: $(namePrefix)
      bicepFile: 'infra/bicep/main.container.bicep'
      uamiPrincipalId: $(uamiPrincipalId)
      uamiId: $(uamiId)
      uamiClientId: $(uamiClientId)
      storageAccountName: $(storageAccountName)
      logAnalyticsWorkspaceId: $(logAnalyticsWorkspaceId)
      logAnalyticsWorkspaceKey: $(logAnalyticsWorkspaceKey)
      dockerHubRepository: $(dockerHubRepository)
      imageTag: $(imageTag)
      trainingMode: serverless
