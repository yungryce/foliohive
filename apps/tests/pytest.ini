[pytest]
minversion = 7.0
pythonpath =
    ..
    ../shared
testpaths =
    ../shared/cache/tests
    ../shared/github/tests
    ../shared/ai/tests
    ../shared/models/tests
    ../api-gateway/tests
    ../sync-worker/tests
    ../merge-worker/tests
    ../training-worker/tests
    integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Fast isolated tests with mocked dependencies
    integration: Tests that require Azurite or external services
    slow: Long-running scenarios
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
