[pytest]
minversion = 8.0

# Add app directories to pythonpath so tests can import function_app
pythonpath = 
    ../api-gateway
    ../sync-worker
    ../merge-worker
    ../training-worker

# Explicit test paths - avoids namespace package issues
testpaths =
    .
    ../api-gateway/tests
    ../sync-worker/tests
    ../merge-worker/tests
    ../shared/src/foliohive_shared/cache/tests
    ../shared/src/foliohive_shared/github/tests
    ../shared/src/foliohive_shared/ai/tests
    ../shared/src/foliohive_shared/models/tests
    # ../training-worker/tests  # Excluded: uses spec_from_file_location which breaks in unified test runner

# Exclude directories that shouldn't be scanned
norecursedirs = .venv .git __pycache__ .pytest_cache htmlcov .azurite node_modules training-worker

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --import-mode=importlib

# Test markers
markers =
    unit: Fast isolated tests with mocked dependencies
    integration: Tests that require Azurite or external services
    slow: Long-running scenarios

# Suppress noisy warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
