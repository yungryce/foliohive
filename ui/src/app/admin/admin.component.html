<div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900/80 backdrop-blur-sm border-r border-slate-700 min-h-screen p-6">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-white mb-1">Admin Panel</h1>
        <p class="text-sm text-gray-400">{{ username }}</p>
      </div>

      <nav class="space-y-2">
        <a 
          routerLink="/admin/monitoring" 
          routerLinkActive="bg-purple-600 text-white"
          class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-purple-600/50 hover:text-white transition-colors">
          📊 Monitoring
        </a>
        <a 
          routerLink="/admin/jobs" 
          routerLinkActive="bg-purple-600 text-white"
          class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-purple-600/50 hover:text-white transition-colors">
          📋 Jobs
        </a>
        <a 
          routerLink="/admin/users" 
          routerLinkActive="bg-purple-600 text-white"
          class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-purple-600/50 hover:text-white transition-colors">
          👥 Users
        </a>
        <a 
          routerLink="/admin/api-usage" 
          routerLinkActive="bg-purple-600 text-white"
          class="block px-4 py-2 rounded-lg text-gray-300 hover:bg-purple-600/50 hover:text-white transition-colors">
          🔌 API Usage
        </a>
      </nav>

      <div class="mt-auto pt-8 border-t border-slate-700">
        <a href="/" class="block px-4 py-2 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-white transition-colors mb-2">
          🏠 Back to Home
        </a>
        <button 
          (click)="logout()"
          class="w-full px-4 py-2 rounded-lg text-red-400 hover:bg-red-900/20 hover:text-red-300 transition-colors text-left">
          🚪 Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
