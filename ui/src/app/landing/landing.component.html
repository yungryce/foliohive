<div class="container mx-auto px-4 py-24 bg-[var(--bg)] text-[var(--fg)] transition-colors">
  <div class="max-w-2xl mx-auto">
    <div class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-5">
      <label class="block text-sm font-medium text-[var(--muted)] mb-1" for="username">GitHub username</label>
      <input
        id="username"
        [(ngModel)]="username"
        placeholder="e.g., octocat"
        class="w-full px-3 py-2 rounded-md border border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] focus:outline-none focus:ring-2 focus:ring-[var(--ring)]"
      />

      <div class="mt-4 flex gap-3 items-center">
        <button
          (click)="start()"
          [disabled]="loading"
          class="px-4 py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] hover:brightness-95"
        >
          {{ loading ? 'Starting…' : 'Continue' }}
        </button>
      </div>

      <p *ngIf="error" class="mt-3 text-sm text-red-500">{{ error }}</p>
    </div>
  </div>
</div>
