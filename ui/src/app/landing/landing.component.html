<div class="container mx-auto px-4 py-24 bg-[var(--bg)] text-[var(--fg)] transition-colors">
  <div class="mx-auto max-w-5xl">
    <div class="grid gap-10 lg:grid-cols-[minmax(0,280px)_1fr]">
      <app-candidate-list heading="Recent candidates" autoNavigate="/projects"></app-candidate-list>

      <div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-6 shadow-sm">
        <label class="block text-sm font-medium text-[var(--muted)] mb-1" for="username">GitHub username</label>
        <input
          id="username"
          [(ngModel)]="username"
          placeholder="e.g., octocat"
          (keyup.enter)="start()"
          [disabled]="loading"
          class="w-full px-3 py-2 rounded-md border border-[var(--border)] bg-[var(--bg)] text-[var(--fg)] focus:outline-none focus:ring-2 focus:ring-[var(--ring)] disabled:opacity-50"
        />

        <div class="mt-4">
          <button
            (click)="start()"
            [disabled]="loading"
            class="px-4 py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] hover:brightness-95 disabled:opacity-50"
          >
            {{ loading ? 'Building...' : 'Continue' }}
          </button>
        </div>

        <!-- Job status while loading -->
        <div *ngIf="loading" class="mt-3 flex items-center gap-2">
          <app-job-status-badge [status]="activeJobStatus" [loading]="true" />
        </div>

        <!-- Error message -->
        <p *ngIf="error" class="mt-3 text-sm text-red-500">{{ error }}</p>
      </div>
    </div>
  </div>
</div>
