<div class="container mx-auto px-4 py-8 bg-(--bg) text-(--fg) transition-colors">
  <div class="grid gap-6 lg:grid-cols-[260px_minmax(0,1fr)]">
    <aside class="rounded-lg border border-(--border) bg-(--card) p-4 h-max">
      <app-candidate-list heading="Candidates" (candidateSelected)="selectCandidate($event.username)"></app-candidate-list>
    </aside>

    <main>
      <h1 class="text-2xl font-bold mb-3">AI Review</h1>

      <div *ngIf="activeUsername" class="rounded-lg border border-(--border) bg-(--card) p-4 mb-6">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="text-sm text-(--muted)">Active candidate</div>
            <div class="text-lg font-semibold">{{ activeUsername }}</div>
          </div>
          <a routerLink="/profile" class="px-3 py-2 rounded bg-(--soft) hover:brightness-95">View profile</a>
        </div>
      </div>


      <div *ngIf="suggested.length" class="rounded-lg border border-(--border) bg-(--card) p-4 mb-6">
        <h2 class="text-sm font-semibold mb-2">Suggested repositories (based on skills)</h2>
        <div class="flex flex-wrap gap-2">
          <a
            *ngFor="let r of suggested"
            [routerLink]="['/projects', r.name]"
            class="px-2 py-1 rounded bg-(--chip-bg) text-(--chip-fg) text-sm hover:brightness-95"
          >
            {{ r.name }}
          </a>
        </div>
      </div>

      <div class="rounded-lg border border-(--border) bg-(--card) p-4" [class.opacity-60]="noRepositories || !summaryReady">
        <label for="query" class="block text-sm font-medium text-(--muted)">Ask about this candidate</label>
        <textarea
          id="query"
          [(ngModel)]="query"
          rows="3"
          [disabled]="noRepositories || !summaryReady || loadingAnswer"
          class="w-full mt-2 px-3 py-2 rounded-md border border-(--border) bg-(--bg) text-(--fg) focus:outline-none focus:ring-2 focus:ring-(--ring)"
          placeholder="e.g., Which repos best demonstrate system design?"
        ></textarea>
        <div class="mt-3 flex items-center gap-3">
          <button
            (click)="ask()"
            class="px-4 py-2 rounded bg-(--primary) text-(--primary-foreground) hover:brightness-95"
            [disabled]="loadingAnswer || noRepositories || !summaryReady"
          >
            {{ loadingAnswer ? 'Asking…' : 'Ask' }}
          </button>
          <app-job-status-badge *ngIf="!summaryReady" [status]="jobStatus" [loading]="!!jobStatus" />
        </div>
        <p *ngIf="error" class="mt-2 text-sm text-red-500">{{ error }}</p>
        <p *ngIf="!summaryReady && !error" class="mt-2 text-sm text-(--muted)">
          Waiting for portfolio data to be processed…
        </p>
      </div>

      <div *ngIf="repositoriesUsed.length" class="rounded-lg border border-(--border) bg-(--card) p-4 mt-6">
        <h2 class="text-sm font-semibold mb-2">Repositories used</h2>
        <div class="flex flex-wrap gap-2 text-sm">
          <span *ngFor="let r of repositoriesUsed" class="px-2 py-1 rounded bg-(--chip-bg) text-(--chip-fg)">
            {{ r.name }} <span class="text-(--muted)">({{ r.relevance_score | number:'1.2-2' }})</span>
          </span>
        </div>
      </div>

      <article *ngIf="answerMarkdown" class="rounded-lg border border-(--border) bg-(--card) p-4 mt-6">
        <markdown [data]="answerMarkdown" class="markdown-content"></markdown>
      </article>
    </main>
  </div>
</div>
