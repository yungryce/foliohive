# CD pipeline for Container (Training Worker)
# - Triggered by ci-container pipeline completion
# - First step: Validates core infrastructure exists (fails fast if not)
# - Deploys container instance infra via Bicep
# - Uses container image from Docker Hub (pushed by CI)
#
# Usage: Configure via params/params-container.yml

resources:
  pipelines:
  - pipeline: ci-container
    source: ci-container
    trigger: true

parameters:
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''
  location: 'westus2'
  namePrefix: 'cloudfolio'
  bicepFile: 'infra/bicep/main.container.bicep'

  # Core infra outputs
  uamiPrincipalId: ''
  uamiId: ''
  uamiClientId: ''
  storageAccountName: ''
  logAnalyticsWorkspaceId: ''
  logAnalyticsWorkspaceKey: ''

  # Image config (uses tag pushed by ci-container pipeline)
  dockerHubRepository: ''
  imageTag: '$(resources.pipeline.ci-container.runID)'

  # Container behavior
  trainingMode: 'serverless'
  queueName: 'model-training'
  blobContainerName: 'github-cache'
  restartPolicy: 'OnFailure'
  cpuCores: '2.0'
  memoryGb: '4.0'

stages:
- stage: Ensure_Core_Infrastructure
  displayName: 'Ensure Core Infrastructure'
  jobs:
    - template: deploy-core-infra.yml
      parameters:
        azureServiceConnection: ${{ parameters.azureServiceConnection }}
        subscriptionId: ${{ parameters.subscriptionId }}
        resourceGroupName: ${{ parameters.resourceGroupName }}
        location: ${{ parameters.location }}
        namePrefix: ${{ parameters.namePrefix }}
        bicepFile: 'infra/bicep/main.bicep'
        bicepParamFile: 'infra/bicep/main.bicepparam'

- stage: CD_Container
  displayName: 'CD: Deploy Training Worker Container'
  dependsOn: Ensure_Core_Infrastructure
  jobs:
    - job: Deploy_Container
      displayName: Deploy container instance
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          displayName: 'Checkout source code'

        - task: AzureResourceManagerTemplateDeployment@3
          displayName: Deploy container instance (Incremental)
          inputs:
            deploymentScope: Resource Group
            azureResourceManagerConnection: '${{ parameters.azureServiceConnection }}'
            subscriptionId: '${{ parameters.subscriptionId }}'
            action: Select Resource Group
            resourceGroupName: '${{ parameters.resourceGroupName }}'
            location: '${{ parameters.location }}'
            templateLocation: Linked artifact
            templateFile: ${{ parameters.bicepFile }}
            overrideParameters: |
              -location ${{ parameters.location }}
              -namePrefix ${{ parameters.namePrefix }}
              -containerImageUri "${{ parameters.dockerHubRepository }}:${{ parameters.imageTag }}"
              -uamiPrincipalId "${{ parameters.uamiPrincipalId }}"
              -uamiId "${{ parameters.uamiId }}"
              -uamiClientId "${{ parameters.uamiClientId }}"
              -storageAccountName "${{ parameters.storageAccountName }}"
              -logAnalyticsWorkspaceId "${{ parameters.logAnalyticsWorkspaceId }}"
              -logAnalyticsWorkspaceKey "${{ parameters.logAnalyticsWorkspaceKey }}"
              -trainingMode "${{ parameters.trainingMode }}"
              -queueName "${{ parameters.queueName }}"
              -blobContainerName "${{ parameters.blobContainerName }}"
              -restartPolicy "${{ parameters.restartPolicy }}"
              -cpuCores "${{ parameters.cpuCores }}"
              -memoryGb "${{ parameters.memoryGb }}"
            deploymentMode: Incremental
            deploymentName: 'container-${{ parameters.namePrefix }}'
