# Reusable job template for deploying a Function App
# - Checks if artifact exists (if not, skips deployment)
# - Validates core infrastructure outputs exist
# - Deploys function infra via Bicep
# - Deploys code to Function App
#
# Used by: cd-functions.yml (unified CD pipeline)
# Design: Reactive and simple - artifact existence is the single source of truth

parameters:
  - name: functionName
    type: string
  - name: bicepFile
    type: string
    default: './infra/bicep/main.functions.bicep'

jobs:
  - job: Deploy_${{ replace(parameters.functionName, '-', '_') }}
    displayName: 'Deploy ${{ parameters.functionName }}'
    pool:
      vmImage: ubuntu-latest
    variables:
      artifactExists: 'false'
      functionAppParameter: '${{ parameters.functionName }}'
    steps:
      - checkout: self
        displayName: 'Checkout source code'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(pythonVersion)'
        inputs:
          versionSpec: '$(pythonVersion)'

      # Debug visibility
      - bash: |
          echo "Function name: ${{ parameters.functionName }}"
          echo "CI run ID: $(resources.pipeline.functions_ci.runID)"
          echo "Expected artifact: ${{ parameters.functionName }}-$(resources.pipeline.functions_ci.runID)"
          echo "Workspace:"
          ls -la "$(Pipeline.Workspace)"
        displayName: Debug pipeline resource context

      # Download artifact from CI
      - download: functions_ci
        displayName: Download ${{ parameters.functionName }} artifact
        artifact: ${{ parameters.functionName }}-$(resources.pipeline.functions_ci.runID)
        continueOnError: true

      # Check artifact existence
      - bash: |
          set -euo pipefail

          ARTIFACT_NAME="${{ parameters.functionName }}-$(resources.pipeline.functions_ci.runID)"
          ARTIFACT_DIR="$(Pipeline.Workspace)/functions_ci/$ARTIFACT_NAME"
          ARTIFACT_ZIP="$ARTIFACT_DIR/${{ parameters.functionName }}.zip"

          echo "Checking for artifact zip:"
          echo "$ARTIFACT_ZIP"

          if [ -f "$ARTIFACT_ZIP" ]; then
            echo "Artifact found"
            echo "##vso[task.setvariable variable=artifactExists]true"
          else
            echo "Artifact not found"
            echo "##vso[task.setvariable variable=artifactExists]false"
          fi
        displayName: Check artifact existence

      # Get core infrastructure outputs
      - task: AzureCLI@2
        displayName: 'Get core infrastructure outputs'
        condition: eq(variables['artifactExists'], 'true')
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG_NAME="$(resourceGroupName)"
            
            echo "=== Retrieving Core Infrastructure Outputs ==="
            echo "=== Debug: Raw outputs ==="
            echo "$OUTPUTS" | jq '.'
            
            # Extract and validate required outputs
            APP_SERVICE_PLAN_ID=$(echo "$OUTPUTS" | jq -r '.appServicePlanId.value // empty')
            FUNCTIONS_SUBNET_ID=$(echo "$OUTPUTS" | jq -r '.functionsSubnetId.value // empty')
            PRIVATE_ENDPOINTS_SUBNET_ID=$(echo "$OUTPUTS" | jq -r '.privateEndpointsSubnetId.value // empty')
            UAMI_ID=$(echo "$OUTPUTS" | jq -r '.uamiId.value // empty')
            UAMI_CLIENT_ID=$(echo "$OUTPUTS" | jq -r '.uamiClientId.value // empty')
            APP_INSIGHTS_CONN_STR=$(echo "$OUTPUTS" | jq -r '.appInsightsConnectionString.value // empty')
            PRIVATE_DNS_ZONE_ID=$(echo "$OUTPUTS" | jq -r '.privateDnsZoneAzureWebsitesId.value // empty')
            STORAGE_ACCOUNT_NAME=$(echo "$OUTPUTS" | jq -r '.storageAccountName.value // empty')
            
            # Validate critical outputs
            if [ -z "$UAMI_ID" ] || [ -z "$APP_SERVICE_PLAN_ID" ] || [ -z "$STORAGE_ACCOUNT_NAME" ]; then
              echo "##vso[task.logissue type=error]Missing critical infrastructure outputs"
              echo "UAMI_ID: $UAMI_ID"
              echo "APP_SERVICE_PLAN_ID: $APP_SERVICE_PLAN_ID"
              echo "STORAGE_ACCOUNT_NAME: $STORAGE_ACCOUNT_NAME"
              exit 1
            fi
            
            # Set as pipeline variables
            echo "##vso[task.setvariable variable=appServicePlanId]$APP_SERVICE_PLAN_ID"
            echo "##vso[task.setvariable variable=functionsSubnetId]$FUNCTIONS_SUBNET_ID"
            echo "##vso[task.setvariable variable=privateEndpointsSubnetId]$PRIVATE_ENDPOINTS_SUBNET_ID"
            echo "##vso[task.setvariable variable=uamiId]$UAMI_ID"
            echo "##vso[task.setvariable variable=uamiClientId]$UAMI_CLIENT_ID"
            echo "##vso[task.setvariable variable=appInsightsConnectionString]$APP_INSIGHTS_CONN_STR"
            echo "##vso[task.setvariable variable=privateDnsZoneAzureWebsitesId]$PRIVATE_DNS_ZONE_ID"
            echo "##vso[task.setvariable variable=storageAccountName]$STORAGE_ACCOUNT_NAME"
            
            echo "✓ Infrastructure outputs retrieved and validated"

      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy ${{ parameters.functionName }} infra'
        condition: eq(variables['artifactExists'], 'true')
        inputs:
          deploymentScope: 'Resource Group'
          azureResourceManagerConnection: '$(azureServiceConnection)'
          subscriptionId: '$(subscriptionId)'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          # csmFile: '$(System.DefaultWorkingDirectory)/${{ parameters.bicepFile }}'
          csmFile: '${{ parameters.bicepFile }}'
          overrideParameters: >
            -location "$(location)"
            -functionAppName "$(functionAppParameter)"
            -appServicePlanId "$(appServicePlanId)"
            -functionsSubnetId "$(functionsSubnetId)"
            -privateEndpointsSubnetId "$(privateEndpointsSubnetId)"
            -uamiId "$(uamiId)"
            -uamiClientId "$(uamiClientId)"
            -appInsightsConnectionString "$(appInsightsConnectionString)"
            -privateDnsZoneAzureWebsitesId "$(privateDnsZoneAzureWebsitesId)"
            -storageAccountName "$(storageAccountName)"
            -deployPrivateEndpoint false
          deploymentMode: 'Incremental'
          deploymentName: '${{ parameters.functionName }}-infra'

      # Resolve function app name from deployment outputs
      - task: AzureCLI@2
        displayName: 'Resolve function app name'
        condition: eq(variables['artifactExists'], 'true')
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            deployment_name="${{ parameters.functionName }}-infra"
            funcName=$(az deployment group show -g "$(resourceGroupName)" -n "$deployment_name" --query "properties.outputs.functionAppName.value" -o tsv)
            if [ -z "$funcName" ]; then
              echo "##vso[task.logissue type=error]Failed to read functionAppName from deployment outputs"
              exit 1
            fi
            echo "##vso[task.setvariable variable=functionAppName]$funcName"
            echo "✓ Resolved function app: $funcName"

      # Deploy function code
      - task: AzureFunctionApp@2
        displayName: 'Deploy ${{ parameters.functionName }} code'
        condition: eq(variables['artifactExists'], 'true')
        inputs:
          connectedServiceNameARM: '$(azureServiceConnection)'
          appType: functionAppLinux
          appName: '$(functionAppName)'
          package: '$(Pipeline.Workspace)/functions_ci/${{ parameters.functionName }}-$(resources.pipeline.functions_ci.runID)/${{ parameters.functionName }}.zip'
