# Reusable template for deploying core infrastructure
# - Used by infra-core.yml (standalone deployment)
# - Used by CD pipelines (ensures infra exists before deploying app)
# - Idempotent: Safe to run multiple times

jobs:
  - job: Deploy_Core_Infra
    displayName: Deploy core infrastructure
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        displayName: 'Checkout source code'

      # Fail fast if paths are wrong (prevents "directory instead of file")
      - bash: |
          set -euo pipefail
          ROOT_DIR="${SYSTEM_DEFAULTWORKINGDIRECTORY:-$PWD}"
          BICEP_FILE_PATH="$ROOT_DIR/${{ parameters.bicepFile }}"
          BICEP_PARAM_FILE_PATH="$ROOT_DIR/${{ parameters.bicepParamFile }}"
          echo "=============================="
          echo "VALIDATING BICEP FILES"
          echo "SYSTEM_DEFAULTWORKINGDIRECTORY=$ROOT_DIR"
          echo "bicepFile=${{ parameters.bicepFile }}"
          echo "bicepParamFile=${{ parameters.bicepParamFile }}"
          echo "Resolved bicepFile=$BICEP_FILE_PATH"
          echo "Resolved bicepParamFile=$BICEP_PARAM_FILE_PATH"
          test -f "$BICEP_FILE_PATH"
          test -f "$BICEP_PARAM_FILE_PATH"
          echo "+++ VALIDATION PASSED +++"
        displayName: 'Validate Bicep files exist'

      - task: AzureResourceManagerTemplateDeployment@3
        displayName: Deploy core infrastructure
        inputs:
          deploymentScope: 'Resource Group'
          azureResourceManagerConnection: '${{ parameters.azureServiceConnection }}'
          subscriptionId: '${{ parameters.subscriptionId }}'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '${{ parameters.resourceGroupName }}'
          location: '${{ parameters.location }}'
          templateLocation: 'Linked artifact'
          csmFile: '${{ parameters.bicepFile }}'
          csmParametersFile: '${{ parameters.bicepParamFile }}'
          parametersLocation: 'Linked artifact'
          overrideParameters: |
            -location ${{ parameters.location }}
            -namePrefix ${{ parameters.namePrefix }}
          deploymentMode: 'Incremental'
          deploymentName: 'core-${{ parameters.namePrefix }}'
