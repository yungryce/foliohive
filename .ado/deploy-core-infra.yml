# Reusable template for deploying core infrastructure
# - Used by infra-core.yml (standalone deployment)
# - Used by CD pipelines (ensures infra exists before deploying app)
# - Idempotent: Safe to run multiple times

jobs:
  - job: Deploy_Core_Infra
    displayName: Deploy core infrastructure
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        displayName: 'Checkout source code'

      - task: AzureResourceManagerTemplateDeployment@3
        displayName: Deploy core infrastructure
        name: DeployCoreInfra
        inputs:
          deploymentScope: 'Resource Group'
          azureResourceManagerConnection: '${{ parameters.azureServiceConnection }}'
          subscriptionId: '${{ parameters.subscriptionId }}'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '${{ parameters.resourceGroupName }}'
          location: '${{ parameters.location }}'
          templateLocation: 'Linked artifact'
          csmFile: '${{ parameters.bicepFile }}'
          csmParametersFile: '${{ parameters.bicepParamFile }}'
          parametersLocation: 'Linked artifact'
          overrideParameters: '-location "${{ parameters.location }}" -namePrefix "${{ parameters.namePrefix }}"'
          deploymentMode: 'Incremental'
          deploymentName: 'core-${{ parameters.namePrefix }}'
          deploymentOutputs: 'coreInfraOutputs'

      - task: AzureCLI@2
        displayName: 'Extract and persist core infrastructure outputs'
        inputs:
          azureSubscription: '${{ parameters.azureServiceConnection }}'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            
            echo "=== Extracting Core Infrastructure Outputs ==="
            
            # Parse deployment outputs from ARM task
            OUTPUTS='$(coreInfraOutputs)'
            echo "Raw outputs: $OUTPUTS"
            
            # Extract all required values
            NAME_PREFIX=$(echo "$OUTPUTS" | jq -r '.namePrefixOut.value // .namePrefix.value')
            UNIQUE_SUFFIX=$(echo "$OUTPUTS" | jq -r '.uniqueSuffixOut.value // .uniqueSuffix.value')
            UAMI_ID=$(echo "$OUTPUTS" | jq -r '.uamiId.value')
            UAMI_CLIENT_ID=$(echo "$OUTPUTS" | jq -r '.uamiClientId.value')
            APP_INSIGHTS_NAME=$(echo "$OUTPUTS" | jq -r '.appInsightsName.value')
            LOG_ANALYTICS_WORKSPACE_ID=$(echo "$OUTPUTS" | jq -r '.logAnalyticsWorkspaceId.value')
            FUNCTIONS_SUBNET_ID=$(echo "$OUTPUTS" | jq -r '.functionsSubnetId.value')
            PRIVATE_ENDPOINTS_SUBNET_ID=$(echo "$OUTPUTS" | jq -r '.privateEndpointsSubnetId.value')
            PRIVATE_DNS_ZONE_ID=$(echo "$OUTPUTS" | jq -r '.privateDnsZoneAzureWebsitesId.value')
            STORAGE_ACCOUNT_NAME=$(echo "$OUTPUTS" | jq -r '.storageAccountName.value')

            echo "Extracted values:"
            echo "  NAME_PREFIX:                $NAME_PREFIX"
            echo "  UNIQUE_SUFFIX:              $UNIQUE_SUFFIX"
            echo "  UAMI_ID:                    $UAMI_ID"
            echo "  UAMI_CLIENT_ID:             $UAMI_CLIENT_ID"
            echo "  APP_INSIGHTS_NAME:          $APP_INSIGHTS_NAME"
            echo "  LOG_ANALYTICS_WORKSPACE_ID: $LOG_ANALYTICS_WORKSPACE_ID"
            echo "  FUNCTIONS_SUBNET_ID:        $FUNCTIONS_SUBNET_ID"
            echo "  STORAGE_ACCOUNT_NAME:       $STORAGE_ACCOUNT_NAME"

            # Validate critical outputs
            if [ -z "$NAME_PREFIX" ] || [ -z "$UNIQUE_SUFFIX" ] || [ -z "$UAMI_ID" ] || [ -z "$APP_INSIGHTS_NAME" ] || [ -z "$STORAGE_ACCOUNT_NAME" ]; then
              echo "##vso[task.logissue type=error]Missing critical infrastructure outputs from deployment"
              exit 1
            fi
            
            # Create outputs directory
            mkdir -p $(Build.ArtifactStagingDirectory)/infra-outputs
            
            # Save as JSON artifact for downstream pipelines
            cat > $(Build.ArtifactStagingDirectory)/infra-outputs/core-infra.json <<EOF
            {
              "namePrefix": "$NAME_PREFIX",
              "uniqueSuffix": "$UNIQUE_SUFFIX",
              "uamiId": "$UAMI_ID",
              "uamiClientId": "$UAMI_CLIENT_ID",
              "appInsightsName": "$APP_INSIGHTS_NAME",
              "logAnalyticsWorkspaceId": "$LOG_ANALYTICS_WORKSPACE_ID",
              "functionsSubnetId": "$FUNCTIONS_SUBNET_ID",
              "privateEndpointsSubnetId": "$PRIVATE_ENDPOINTS_SUBNET_ID",
              "privateDnsZoneAzureWebsitesId": "$PRIVATE_DNS_ZONE_ID",
              "storageAccountName": "$STORAGE_ACCOUNT_NAME"
            }
            EOF
            
            echo "✓ Core infrastructure outputs saved to artifact"
            cat $(Build.ArtifactStagingDirectory)/infra-outputs/core-infra.json

      - publish: $(Build.ArtifactStagingDirectory)/infra-outputs
        artifact: infra-outputs
        displayName: 'Publish infrastructure outputs artifact'

