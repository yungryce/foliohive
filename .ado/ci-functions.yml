# Unified CI pipeline for all Function Apps
# - Detects which functions changed (single source of truth)
# - Builds only changed functions (conditional execution)
# - Publishes artifacts for changed functions only
# - Triggered by changes to any function or shared library
# - Standalone: No Azure dependency, triggered by code changes only

pr:
  branches:
    include:
      - main
  paths:
    include:
      - api/v0.4.0/function-app/**
      - api/v0.4.0/shared/**
      - .ado/ci-functions.yml
      - .ado/ci-build-function.yml
      - .ado/detect-function-changes.yml
    exclude:
      - api/v0.4.0/**/tests/**
      - api/v0.4.0/**/__pycache__/**
      - '**/*.pyc'

variables:
  - group: 'folioVars'

stages:
- stage: Detect_Changes
  displayName: 'Detect Changed Functions'
  jobs:
    - template: detect-function-changes.yml

- stage: CI_Functions
  displayName: 'CI: Build Changed Functions'
  dependsOn: Detect_Changes
  jobs:
    - template: ci-build-function.yml
      parameters:
        functionName: 'flex-app'
        functionDir: 'api/v0.4.0/function-app'
        sharedDir: 'api/v0.4.0/shared'
        pythonVersion: '$(pythonVersion)'
        condition: eq(stageDependencies.Detect_Changes.Detect_Changes.outputs['DetectChanges.flexAppChanged'], 'true')
        
