# Core Infrastructure Pipeline
# - Deploys foundational Azure resources (VNet, storage, identity, etc.)
# - Triggered by infrastructure code changes
# - Safe to re-run anytime (idempotent)
# - Must complete before any CD pipelines run

trigger:
  branches:
    include:
      - main
      - test
  paths:
    include:
      - infra/bicep/**
      - .ado/infra-core.yml
      - .ado/params/params-core.yml

parameters:
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''
  location: 'westus2'
  namePrefix: 'cloudfolio'
  tags: '{}'
  bicepFile: 'infra/bicep/main.bicep'
  bicepParamFile: 'infra/bicep/main.bicepparam'

stages:
- stage: Core_Infrastructure
  displayName: Core Infrastructure (one-time)
  jobs:
    - template: deploy-core-infra.yml
      parameters:
        azureServiceConnection: ${{ parameters.azureServiceConnection }}
        subscriptionId: ${{ parameters.subscriptionId }}
        resourceGroupName: ${{ parameters.resourceGroupName }}
        location: ${{ parameters.location }}
        namePrefix: ${{ parameters.namePrefix }}
        bicepFile: ${{ parameters.bicepFile }}
        bicepParamFile: ${{ parameters.bicepParamFile }}

