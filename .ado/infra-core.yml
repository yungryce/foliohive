# Core Infrastructure Pipeline
# - Deploys foundational Azure resources (VNet, storage, identity, etc.)
# - Triggered by infrastructure code changes
# - Safe to re-run anytime (idempotent)
# - Must complete before any CD pipelines run

pr:
  branches:
    include:
      - main
  paths:
    include:
      - .ado/infra-core.yml
      - .ado/deploy-core-infra.yml
      - './infra/bicep/main.bicep'
      - './infra/bicep/main.bicepparam'
      - './infra/bicep/modules/**'
    exclude:
      - './infra/bicep/modules/functionApps.bicep'
      - './infra/bicep/modules/functionAppFlex.bicep'
      - './infra/bicep/modules/staticWebApp.bicep'
      - './infra/bicep/modules/containerInstance.bicep'


variables:
  - group: 'folioVars'




parameters:
  - name: bicepFile
    type: string
    default: './infra/bicep/main.bicep'
  - name: bicepParamFile
    type: string
    default: './infra/bicep/main.bicepparam'


stages:
- stage: Core_Infrastructure
  displayName: Core Infrastructure (one-time)
  jobs:
    - template: deploy-core-infra.yml
      parameters:
        azureServiceConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        resourceGroupName: $(resourceGroupName)
        location: $(location)
        namePrefix: $(namePrefix)
        bicepFile: ${{ parameters.bicepFile }}
        bicepParamFile: ${{ parameters.bicepParamFile }}

