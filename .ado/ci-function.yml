# Generic CI template for Function Apps
# - Builds function package with shared library
# - Publishes artifact via PublishPipelineArtifact@1
# - Triggers on api-gateway, sync-worker, merge-worker, or shared library changes
#
# Usage: Reference with a separate parameter file per function
# Example: template: .ado/ci-function.yml
#          parameters: ${{ variables.ciParams }}

trigger:
  paths:
    include:
      - apps/api-gateway/**
      - apps/sync-worker/**
      - apps/merge-worker/**
      - apps/shared/**
    exclude:
      - apps/**/tests/**
      - apps/**/__pycache__/**
      - '**/*.pyc'

parameters:
  pythonVersion: '3.13'
  functionName: ''
  functionDir: ''
  sharedDir: 'apps/shared'

stages:
- stage: CI_${{ replace(parameters.functionName, '-', '_') }}
  displayName: 'CI: Build ${{ parameters.functionName }}'
  jobs:
    - job: Build_${{ replace(parameters.functionName, '-', '_') }}
      displayName: 'Build & publish ${{ parameters.functionName }} artifact'
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: UsePythonVersion@0
          displayName: Use Python ${{ parameters.pythonVersion }}
          inputs:
            versionSpec: '${{ parameters.pythonVersion }}'

        - script: |
            set -euo pipefail

            dir="${{ parameters.functionDir }}"
            shared="${{ parameters.sharedDir }}"
            artifact="$BUILD_ARTIFACTSTAGINGDIRECTORY/${{ parameters.functionName }}.zip"
            site_packages="$dir/.python_packages/lib/site-packages"

            if [ ! -d "$dir" ]; then
              echo "##vso[task.logissue type=error]Function directory not found: $dir"
              exit 1
            fi

            echo "[CI] Packaging function: ${{ parameters.functionName }}"

            rm -rf "$site_packages"
            mkdir -p "$site_packages"

            python -m pip install --upgrade pip
            python -m pip install -r "$dir/requirements.txt" --target "$site_packages"
            python -m pip install "$shared" --target "$site_packages"

            (cd "$dir" && zip -r "$artifact" . \
              -x "**/__pycache__/**" \
              -x "**/*.pyc" \
              -x "**/.venv/**" \
              -x "**/.pytest_cache/**" \
              -x "**/.git/**" \
              -x "**/.DS_Store")

            echo "[CI] Created artifact: $artifact"
          displayName: 'Package ${{ parameters.functionName }}'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish ${{ parameters.functionName }} artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.functionName }}.zip'
            artifact: '${{ parameters.functionName }}-$(Build.BuildId)'
            publishLocation: 'pipeline'
