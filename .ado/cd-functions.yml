# Unified CD pipeline for all Function Apps
# - Triggered by ci-functions pipeline completion
# - Reactive design: attempts to deploy all functions, skips if artifact not found
# - Single source of truth: CI decides what to build, artifact existence decides what to deploy
# - Simple and maintainable: no cross-stage dependencies, no complex conditions

resources:
  pipelines:
    - pipeline: functions_ci
      source: yungryce.cloudfolio.function-ci
      trigger: true
    - pipeline: core_infra
      source: yungryce.cloudfolio.infra
      trigger: true

variables:
  - group: 'Cloudfolio-Vars'

stages:
- stage: Deploy_Functions
  displayName: 'Deploy Functions'
  jobs:
    - template: cd-deploy-function.yml
      parameters:
        functionName: 'api-gateway'
        bicepFile: './infra/bicep/main.functions.bicep'

    - template: cd-deploy-function.yml
      parameters:
        functionName: 'sync-worker'
        bicepFile: './infra/bicep/main.functions.bicep'

    - template: cd-deploy-function.yml
      parameters:
        functionName: 'merge-worker'
        bicepFile: './infra/bicep/main.functions.bicep'
