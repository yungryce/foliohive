# Unified CD pipeline for all Function Apps
# - Triggered by ci-functions pipeline completion
# - Reactive design: attempts to deploy all functions, skips if artifact not found
# - Single source of truth: CI decides what to build, artifact existence decides what to deploy
# - Simple and maintainable: no cross-stage dependencies, no complex conditions

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: functions_ci
      source: yungryce.foliohive.function-ci
      trigger: true
    - pipeline: core_infra
      source: yungryce.foliohive.infra
      trigger: true

# pr:
#   branches:
#     include:
#       - main
#   paths:
#     include:
#       - .ado/cd-functions.yml
#       - .ado/cd-deploy-function.yml
#       - infra/bicep/main.functions.bicep
#       - infra/bicep/modules/functionApp.bicep

variables:
  - group: 'folioVars'

stages:
- stage: Deploy_Functions
  displayName: 'Deploy Functions'
  jobs:
    - template: cd-deploy-function.yml
      parameters:
        functionName: 'flex-app'
        bicepFile: './infra/bicep/main.functions.bicep'

    # - template: cd-deploy-function.yml
    #   parameters:
    #     functionName: 'sync-worker'
    #     bicepFile: './infra/bicep/main.functions.bicep'

    # - template: cd-deploy-function.yml
    #   parameters:
    #     functionName: 'merge-worker'
    #     bicepFile: './infra/bicep/main.functions.bicep'

    - job: Capture_Function_App_Outputs
      displayName: 'Capture Function App outputs'
      dependsOn:
        - Deploy_flex_app
      condition: succeeded('Deploy_flex_app')
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          displayName: 'Checkout source code'

        - task: AzureCLI@2
          displayName: 'Read flex-app deployment outputs'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              
              echo "=== Reading function app Deployment Outputs ==="
              
              deployment_name="flex-app-infra"
              rg_name="$(resourceGroupName)"
              
              flex_app_id=$(az deployment group show \
                -g "$rg_name" \
                -n "$deployment_name" \
                --query "properties.outputs.functionAppId.value" \
                -o tsv)
              
              flex_app_hostname=$(az deployment group show \
                -g "$rg_name" \
                -n "$deployment_name" \
                --query "properties.outputs.functionAppDefaultHostname.value" \
                -o tsv)
              
              if [ -z "$flex_app_id" ] || [ -z "$flex_app_hostname" ]; then
                echo "##vso[task.logissue type=error]Failed to read function app outputs"
                exit 1
              fi
              
              echo "✓ function app outputs captured"
              echo "  ID: $flex_app_id"
              echo "  Hostname: $flex_app_hostname"
              
              # Write to JSON file for artifact publishing
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              cat > "$(Build.ArtifactStagingDirectory)/function-outputs.json" <<EOF
              {
                "flexAppId": "$flex_app_id",
                "flexAppHostname": "$flex_app_hostname"
              }
              EOF

        - task: PublishPipelineArtifact@1
          displayName: 'Publish function app outputs'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/function-outputs.json'
            artifact: 'function-outputs'
            publishLocation: 'pipeline'