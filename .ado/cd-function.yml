# CD pipeline for Function Apps
# - Triggered by corresponding CI pipeline completion
# - First step: Validates core infrastructure exists (fails fast if not)
# - Deploys function infra via Bicep
# - Downloads artifact from CI pipeline
# - Deploys code to Function App
#
# Usage: Configure via params/params-{functionName}.yml

resources:
  pipelines:
    - pipeline: ci-function
      source: ci-function # given pipeline name
      trigger: true

stages:
- stage: Get_Infra_Outputs
  displayName: 'Validate & Retrieve Core Infra Outputs'
  jobs:
    - template: get-core-infra-outputs.yml
      parameters:
        azureServiceConnection: $(azureServiceConnection)
        resourceGroupName: $(resourceGroupName)

- stage: CD_${{ replace(parameters.functionName, '-', '_') }}
  displayName: 'CD: Deploy ${{ parameters.functionName }}'
  dependsOn: Get_Infra_Outputs
  variables:
    appServicePlanId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.appServicePlanId'] ]
    functionsSubnetId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.functionsSubnetId'] ]
    privateEndpointsSubnetId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.privateEndpointsSubnetId'] ]
    uamiId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.uamiId'] ]
    uamiClientId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.uamiClientId'] ]
    appInsightsConnectionString: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.appInsightsConnectionString'] ]
    privateDnsZoneAzureWebsitesId: $[ dependencies.Get_Infra_Outputs.outputs['Get_Core_Infra_Outputs.privateDnsZoneAzureWebsitesId'] ]
  jobs:
    - job: Deploy_${{ replace(parameters.functionName, '-', '_') }}
      displayName: 'Deploy infra + code for ${{ parameters.functionName }}'
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          displayName: 'Checkout source code'

        - task: UsePythonVersion@0
          displayName: Use Python $(pythonVersion)
          inputs:
            versionSpec: '$(pythonVersion)'

        # Download artifact from CI function pipeline
        - download: ci-function
          displayName: 'Download ${{ parameters.functionName }} artifact from CI'
          artifact: ${{ parameters.functionName }}-$(Build.BuildId)

        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Deploy ${{ parameters.functionName }} (Incremental)'
          inputs:
            deploymentScope: Resource Group
            azureResourceManagerConnection: '$(azureServiceConnection)'
            subscriptionId: '$(subscriptionId)'
            action: Select Resource Group
            resourceGroupName: '$(resourceGroupName)'
            location: '$(location)'
            templateLocation: Linked artifact
            templateFile: ${{ parameters.bicepFile }}
            overrideParameters: |
              -location $(location)
              -functionAppName "${{ coalesce(parameters.functionAppName, format('{0}-{1}', variables.namePrefix, parameters.functionName)) }}"
              -appServicePlanId "$(appServicePlanId)"
              -functionsSubnetId "$(functionsSubnetId)"
              -privateEndpointsSubnetId "$(privateEndpointsSubnetId)"
              -uamiId "$(uamiId)"
              -uamiClientId "$(uamiClientId)"
              -appInsightsConnectionString "$(appInsightsConnectionString)"
              -privateDnsZoneAzureWebsitesId "$(privateDnsZoneAzureWebsitesId)"
              -deployPrivateEndpoint "$(deployPrivateEndpoints)"
            deploymentMode: Incremental
            deploymentName: '${{ parameters.functionName }}-$(Build.BuildId)'

        - task: AzureCLI@2
          displayName: 'Resolve function app name from deployment'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              deployment_name="${{ parameters.functionName }}-$(Build.BuildId)"
              funcName=$(az deployment group show -g "$(resourceGroupName)" -n "$deployment_name" --query "properties.outputs.functionAppName.value" -o tsv)
              if [ -z "$funcName" ]; then
                echo "##vso[task.logissue type=error]Failed to read functionAppName from deployment outputs"
                exit 1
              fi
              echo "##vso[task.setvariable variable=functionAppName]$funcName"
              echo "[CD] Resolved function app: $funcName"

        - task: AzureFunctionApp@2
          displayName: 'Deploy ${{ parameters.functionName }} to Function App'
          inputs:
            connectedServiceNameARM: '$(azureServiceConnection)'
            appType: functionAppLinux
            appName: '$(functionAppName)'
            package: '$(Pipeline.Workspace)/ci-function/${{ parameters.functionName }}-$(Build.BuildId)/${{ parameters.functionName }}.zip'
