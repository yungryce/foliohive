# Generic CI template for Static Web App
# - Builds Angular UI
# - Publishes artifact via PublishPipelineArtifact@1
# - Triggers on frontend code or config changes
#
# Usage: Reference with a unified parameter file
# Example: template: .ado/ci-swa.yml
#          parameters: ${{ variables.ciSwA }}

trigger:
  paths:
    include:
      - ui/**
    exclude:
      - ui/node_modules/**
      - ui/dist/**
      - ui/.angular/cache/**
      - 'ui/**/*.spec.ts'

parameters:
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''
  uiDir: 'ui'

stages:
- stage: CI_SWA
  displayName: 'CI: Build Static Web App'
  jobs:
    - job: Build_UI
      displayName: 'Build & upload SWA artifact'
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: NodeTool@0
          displayName: Use Node.js 20
          inputs:
            versionSpec: '20.x'

        - script: |
            set -euo pipefail
            dir="${{ parameters.uiDir }}"

            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              echo "##vso[task.logissue type=error]UI directory not found: $dir"
              exit 1
            fi

            echo "[CI] Building Static Web App from $dir"
            cd "$dir"
            npm ci
            npm run build:prod

            if [ ! -d "dist/cloudfolio-ui" ]; then
              echo "##vso[task.logissue type=error]UI build failed: dist/cloudfolio-ui not found"
              exit 1
            fi
          displayName: 'Build Angular UI'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish SWA artifact'
          inputs:
            targetPath: '${{ parameters.uiDir }}/dist/cloudfolio-ui'
            artifact: 'swa-artifact'
            publishLocation: 'pipeline'
