# CI pipeline for merge-worker Function App
# - Builds function package with shared library
# - Publishes artifact via PublishPipelineArtifact@1
# - Triggers on merge-worker or shared library changes
# - Standalone: No Azure dependency, triggered by code changes only

trigger:
  branches:
    include:
      - main
      - test
  paths:
    include:
      - apps/merge-worker/**
      - apps/shared/**
      - .ado/ci-merge-worker.yml
    exclude:
      - apps/**/tests/**
      - apps/**/__pycache__/**
      - '**/*.pyc'

variables:
  - group: 'Cloudfolio-Vars'
  - name: functionName
    value: 'merge-worker'
  - name: functionDir
    value: 'apps/merge-worker'
  - name: sharedDir
    value: 'apps/shared'
  - name: pythonVersion
    value: '3.13'

stages:
- stage: CI_merge_worker
  displayName: 'CI: Build merge-worker'
  jobs:
    - job: Build_merge_worker
      displayName: 'Build & publish merge-worker artifact'
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: UsePythonVersion@0
          displayName: Use Python $(pythonVersion)
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            set -euo pipefail

            dir="$(functionDir)"
            shared="$(sharedDir)"
            artifact="$BUILD_ARTIFACTSTAGINGDIRECTORY/$(functionName).zip"
            site_packages="$dir/.python_packages/lib/site-packages"

            if [ ! -d "$dir" ]; then
              echo "##vso[task.logissue type=error]Function directory not found: $dir"
              exit 1
            fi

            echo "[CI] Packaging function: $(functionName)"

            rm -rf "$site_packages"
            mkdir -p "$site_packages"

            python -m pip install --upgrade pip
            python -m pip install -r "$dir/requirements.txt" --target "$site_packages"
            python -m pip install "$shared" --target "$site_packages"

            (cd "$dir" && zip -r "$artifact" . \
              -x "**/__pycache__/**" \
              -x "**/*.pyc" \
              -x "**/.venv/**" \
              -x "**/.pytest_cache/**" \
              -x "**/.git/**" \
              -x "**/.DS_Store")

            echo "[CI] Created artifact: $artifact"
          displayName: 'Package merge-worker'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish merge-worker artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/$(functionName).zip'
            artifact: '$(functionName)-$(Build.BuildId)'
            publishLocation: 'pipeline'
