# Unified parameters for Static Web App (SWA)
# Used by both: .ado/ci-swa.yml AND .ado/cd-swa.yml
# Inherits shared defaults from: .ado/parameters.yml

parameters:
  # ================================================================================
  # AZURE SUBSCRIPTION & RESOURCE GROUP
  # ================================================================================
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''

  # ================================================================================
  # DEPLOYMENT LOCATION & NAMING
  # ================================================================================
  location: 'westus2'
  namePrefix: 'cloudfolio'

  # ================================================================================
  # CI-SPECIFIC: BUILD & ARTIFACTS
  # ================================================================================
  uiDir: 'ui'
  artifactBuildId: '$(Build.BuildId)'
  artifactContainerName: 'swa-artifacts'
  storageAccountName: ''

  # ================================================================================
  # CD-SPECIFIC: DEPLOYMENT & INFRASTRUCTURE
  # ================================================================================
  bicepFile: 'infra/bicep/main.staticwebapp.bicep'
  
  # Core infra outputs (populated by infra-core stage)
  apiGatewayId: ''
  apiGatewayDefaultHostname: ''

  enableLinkedBackend: false
