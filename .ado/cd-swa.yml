# CD pipeline for Static Web App
# - Triggered by ci-swa pipeline completion
# - First step: Validates core infrastructure exists (fails fast if not)
# - Deploys SWA infra via Bicep
# - Downloads UI artifact from CI pipeline
# - Publishes content to SWA
#
# Usage: Configure via params/params-swa.yml


resources:
  pipelines:
    - pipeline: yungryce.cloudfolio.swa-ci
      source: yungryce.cloudfolio.swa-ci # given pipeline name
      trigger: true

variables:
  - group: 'Cloudfolio-Vars'
  - name: bicepFile
    value: './infra/bicep/main.staticwebapp.bicep'
  - name: enableLinkedBackend
    value: 'true'

stages:
- stage: Ensure_Core_Infrastructure
  displayName: 'Ensure Core Infrastructure'
  jobs:
    - template: deploy-core-infra.yml
      parameters:
        azureServiceConnection: $(azureServiceConnection)
        subscriptionId: $(subscriptionId)
        resourceGroupName: $(resourceGroupName)
        location: $(location)
        namePrefix: $(namePrefix)
        bicepFile: './infra/bicep/main.bicep'
        bicepParamFile: './infra/bicep/main.bicepparam'

- stage: CD_SWA
  displayName: 'CD: Deploy Static Web App'
  dependsOn: Ensure_Core_Infrastructure
  jobs:
    - job: Deploy_Infra
      displayName: 'Deploy SWA infrastructure'
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          displayName: 'Checkout source code'

        # Download artifact from CI pipeline
        - download: ci-swa
          displayName: 'Download SWA artifact from CI'
          artifact: swa-artifact

        - script: |
            echo "##vso[task.setvariable variable=artifactPath;isOutput=true]$(Pipeline.Workspace)/ci-swa/swa-artifact"
          displayName: 'Output artifact path'

        - task: AzureCLI@2
          displayName: 'Query API Gateway function app details'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              
              echo "=== Querying API Gateway Function App ==="
              
              rg_name="$(resourceGroupName)"
              
              # Query resource group for api-gateway function app
              # Function app naming pattern: {namePrefix}-api-gateway-{uniqueSuffix}
              api_gw_functions=$(az functionapp list -g "$rg_name" --query "[?contains(name, 'api-gateway')]" -o json)
              
              if [ "$api_gw_functions" == "[]" ]; then
                echo "##vso[task.logissue type=warning]API Gateway function app not found in resource group"
                echo "Proceeding with empty values - SWA will deploy without linked backend"
                echo "##vso[task.setvariable variable=apiGatewayId]"
                echo "##vso[task.setvariable variable=apiGatewayHostname]"
              else
                api_gateway_id=$(echo "$api_gw_functions" | jq -r '.[0].id')
                api_gateway_hostname=$(echo "$api_gw_functions" | jq -r '.[0].defaultHostName')
                
                if [ -z "$api_gateway_id" ] || [ -z "$api_gateway_hostname" ]; then
                  echo "##vso[task.logissue type=warning]Failed to extract API Gateway details from resource"
                  echo "Proceeding with empty values"
                  echo "##vso[task.setvariable variable=apiGatewayId]"
                  echo "##vso[task.setvariable variable=apiGatewayHostname]"
                else
                  echo "##vso[task.setvariable variable=apiGatewayId]$api_gateway_id"
                  echo "##vso[task.setvariable variable=apiGatewayHostname]$api_gateway_hostname"
                  
                  echo "✓ API Gateway details found"
                  echo "  ID: $api_gateway_id"
                  echo "  Hostname: $api_gateway_hostname"
                fi
              fi

        - task: AzureResourceManagerTemplateDeployment@3
          displayName: Deploy SWA (Incremental)
          inputs:
            deploymentScope: Resource Group
            azureResourceManagerConnection: '$(azureServiceConnection)'
            subscriptionId: '$(subscriptionId)'
            action: Create Or Update Resource Group
            resourceGroupName: '$(resourceGroupName)'
            location: '$(location)'
            templateLocation: Linked artifact
            templateFile: $(bicepFile)
            overrideParameters: |
              -location $(location)
              -namePrefix $(namePrefix)
              -apiGatewayId "$(apiGatewayId)"
              -apiGatewayDefaultHostname "$(apiGatewayHostname)"
              -enableLinkedBackend $(enableLinkedBackend)
            deploymentMode: Incremental
            deploymentName: 'swa-$(namePrefix)'

        - task: AzureCLI@2
          displayName: Read SWA outputs
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              dep="swa-$(namePrefix)"
              swaName=$(az deployment group show -g "$(resourceGroupName)" -n "$dep" --query properties.outputs.staticWebAppName.value -o tsv)
              swaUrl=$(az deployment group show -g "$(resourceGroupName)" -n "$dep" --query properties.outputs.staticWebAppUrl.value -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppName]$swaName"
              echo "##vso[task.setvariable variable=staticWebAppUrl]$swaUrl"
              
              swaToken=$(az staticwebapp secrets list -n "$swaName" -g "$(resourceGroupName)" --query properties.apiKey -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppToken;issecret=true]$swaToken"

        - task: AzureStaticWebApp@0
          displayName: Deploy Static Web App content
          inputs:
            azure_static_web_apps_api_token: '$(staticWebAppToken)'
            workingDirectory: '$(artifactPath)'
            app_location: '.'
            api_location: ''
            output_location: ''
            skip_app_build: true
            skip_api_build: true
