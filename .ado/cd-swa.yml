# CD pipeline for Static Web App
# - Triggered by ci-swa pipeline completion or changes to this pipeline
# - First step: Validates core infrastructure exists (fails fast if not)
# - Deploys SWA infra via Bicep
# - Downloads UI artifact from CI pipeline
# - Publishes content to SWA
#
# Usage: Configure via params/params-swa.yml

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: swa_ci
      source: yungryce.foliohive.swa-ci
      trigger: true
    - pipeline: functions_cd
      source: yungryce.foliohive.function-cd
      trigger: true

# pr:
#   branches:
#     include:
#       - main
#   paths:
#     include:
#       - .ado/cd-swa.yml
#       - infra/bicep/main.staticwebapp.bicep
#       - infra/bicep/modules/staticWebApp.bicep

variables:
  - group: 'folioVars'
  - name: bicepFile
    value: './infra/bicep/main.staticwebapp.bicep'
  - name: enableLinkedBackend
    value: 'true'
  - name: repositoryUrl
    value: 'https://dev.azure.com/chxgbx/foliohive/_git/foliohive'

stages:
- stage: CD_SWA
  displayName: 'CD: Deploy Static Web App'
  jobs:
    - job: Deploy_Infra
      displayName: 'Deploy SWA infrastructure'
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
          displayName: 'Checkout source code'

        - download: swa_ci
          displayName: 'Download SWA artifact from CI'
          artifact: swa-artifact

        - bash: |
            set -euo pipefail
            artifact_path="$(Pipeline.Workspace)/swa_ci/swa-artifact"
            echo "Artifact path: $artifact_path"

            if [ ! -d "$artifact_path" ]; then
              echo "##vso[task.logissue type=error]SWA artifact directory not found: $artifact_path"
              exit 1
            fi

            if [ ! -f "$artifact_path/index.html" ] && [ ! -f "$artifact_path/Index.html" ]; then
              echo "##vso[task.logissue type=error]index.html not found in SWA artifact root: $artifact_path"
              exit 1
            fi

            echo "##vso[task.setvariable variable=artifactPath]$artifact_path"
          displayName: 'Set SWA artifact path'

        - download: functions_cd
          displayName: 'Download function app outputs'
          artifact: function-outputs
          continueOnError: true

        - bash: |
            set -euo pipefail
            
            echo "=== Loading Function App Outputs ==="
            
            FUNC_FILE="$(Pipeline.Workspace)/functions_cd/function-outputs/function-outputs.json"
            
            if [ ! -f "$FUNC_FILE" ]; then
              echo "##vso[task.logissue type=warning]Function app outputs not found; proceeding without linked backend"
              echo "##vso[task.setvariable variable=backendFunctionAppId]"
              echo "##vso[task.setvariable variable=backendFunctionAppHostname]"
              echo "##vso[task.setvariable variable=enableLinkedBackend]false"
              exit 0
            fi
            
            echo "Reading outputs from: $FUNC_FILE"
            cat "$FUNC_FILE"
            
            backend_id=$(jq -r '.flexAppId // empty' "$FUNC_FILE")
            backend_hostname=$(jq -r '.flexAppHostname // empty' "$FUNC_FILE")
            
            if [ -z "$backend_id" ] || [ -z "$backend_hostname" ]; then
              echo "##vso[task.logissue type=warning]Function app outputs incomplete"
              echo "##vso[task.setvariable variable=backendFunctionAppId]"
              echo "##vso[task.setvariable variable=backendFunctionAppHostname]"
              echo "##vso[task.setvariable variable=enableLinkedBackend]false"
            else
              echo "##vso[task.setvariable variable=backendFunctionAppId]$backend_id"
              echo "##vso[task.setvariable variable=backendFunctionAppHostname]$backend_hostname"
              echo "##vso[task.setvariable variable=enableLinkedBackend]true"
              echo "✓ Backend function app loaded"
              echo "  ID: $backend_id"
              echo "  Hostname: $backend_hostname"
            fi
          displayName: 'Load function app outputs'

        - task: AzureResourceManagerTemplateDeployment@3
          displayName: Deploy SWA (Incremental)
          inputs:
            deploymentScope: Resource Group
            azureResourceManagerConnection: '$(azureServiceConnection)'
            subscriptionId: '$(subscriptionId)'
            action: Create Or Update Resource Group
            resourceGroupName: '$(resourceGroupName)'
            location: '$(location)'
            templateLocation: Linked artifact
            csmFile: $(bicepFile)
            overrideParameters: >
              -location "$(location)"
              -namePrefix "$(namePrefix)"
              -repositoryUrl "$(repositoryUrl)"
              -backendFunctionAppId "$(backendFunctionAppId)"
              -backendFunctionAppDefaultHostname "$(backendFunctionAppHostname)"
              -enableLinkedBackend $(enableLinkedBackend)
            deploymentMode: Incremental
            deploymentName: 'swa-$(namePrefix)'

        - task: AzureCLI@2
          displayName: Read SWA outputs
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              dep="swa-$(namePrefix)"
              swaName=$(az deployment group show -g "$(resourceGroupName)" -n "$dep" --query properties.outputs.staticWebAppName.value -o tsv)
              swaUrl=$(az deployment group show -g "$(resourceGroupName)" -n "$dep" --query properties.outputs.staticWebAppUrl.value -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppName]$swaName"
              echo "##vso[task.setvariable variable=staticWebAppUrl]$swaUrl"
              
              swaToken=$(az staticwebapp secrets list -n "$swaName" -g "$(resourceGroupName)" --query properties.apiKey -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppToken;issecret=true]$swaToken"

        - task: AzureStaticWebApp@0
          displayName: Deploy Static Web App content
          inputs:
            azure_static_web_apps_api_token: '$(staticWebAppToken)'
            workingDirectory: '$(artifactPath)'
            app_location: '.'
            api_location: ''
            output_location: ''
            skip_app_build: true
            skip_api_build: true
