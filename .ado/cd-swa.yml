# Generic CD template for Static Web App
# - Builds Bicep template for SWA infrastructure
# - Deploys SWA infra via ARM
# - Downloads UI artifact from Storage
# - Publishes UI content to SWA
#
# Usage: Reference with a unified parameter file
# Example: template: .ado/cd-swa.yml
#          parameters: ${{ variables.cdSwA }}

parameters:
  azureServiceConnection: ''
  subscriptionId: ''
  resourceGroupName: ''
  location: 'westus2'
  namePrefix: 'cloudfolio'
  bicepFile: 'infra/bicep/main.staticwebapp.bicep'

  # Core infra outputs
  apiGatewayId: ''
  apiGatewayDefaultHostname: ''

  # CD-specific
  enableLinkedBackend: false
  storageAccountName: ''
  artifactContainerName: 'swa-artifacts'
  artifactBuildId: '$(Build.BuildId)'

stages:
- stage: CD_SWA
  displayName: 'CD: Deploy Static Web App'
  jobs:
    - job: Deploy_Infra
      displayName: 'Deploy SWA infrastructure'
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: AzureCLI@2
          displayName: Build ARM template from Bicep (SWA)
          inputs:
            azureSubscription: '${{ parameters.azureServiceConnection }}'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              az bicep build --file ${{ parameters.bicepFile }} --outfile main.swa.json

        - task: AzureResourceManagerTemplateDeployment@3
          displayName: Deploy SWA (Incremental)
          inputs:
            deploymentScope: Resource Group
            azureResourceManagerConnection: '${{ parameters.azureServiceConnection }}'
            subscriptionId: '${{ parameters.subscriptionId }}'
            action: Create Or Update Resource Group
            resourceGroupName: '${{ parameters.resourceGroupName }}'
            location: '${{ parameters.location }}'
            templateLocation: Linked artifact
            csmFile: main.swa.json
            overrideParameters: |
              -location ${{ parameters.location }}
              -namePrefix ${{ parameters.namePrefix }}
              -apiGatewayId "${{ parameters.apiGatewayId }}"
              -apiGatewayDefaultHostname "${{ parameters.apiGatewayDefaultHostname }}"
              -enableLinkedBackend ${{ parameters.enableLinkedBackend }}
            deploymentMode: Incremental
            deploymentName: 'swa-${{ parameters.namePrefix }}'

        - task: AzureCLI@2
          displayName: Read SWA outputs
          inputs:
            azureSubscription: '${{ parameters.azureServiceConnection }}'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              dep="swa-${{ parameters.namePrefix }}"
              swaName=$(az deployment group show -g "${{ parameters.resourceGroupName }}" -n "$dep" --query properties.outputs.staticWebAppName.value -o tsv)
              swaUrl=$(az deployment group show -g "${{ parameters.resourceGroupName }}" -n "$dep" --query properties.outputs.staticWebAppUrl.value -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppName]$swaName"
              echo "##vso[task.setvariable variable=staticWebAppUrl]$swaUrl"

              swaToken=$(az staticwebapp secrets list -n "$swaName" -g "${{ parameters.resourceGroupName }}" --query properties.apiKey -o tsv)
              echo "##vso[task.setvariable variable=staticWebAppToken;issecret=true]$swaToken"

    - job: Deploy_Content
      displayName: 'Deploy SWA content'
      dependsOn: Deploy_Infra
      variables:
        staticWebAppName: $[ dependencies.Deploy_Infra.outputs['Deploy_Infra.staticWebAppName'] ]
        staticWebAppUrl: $[ dependencies.Deploy_Infra.outputs['Deploy_Infra.staticWebAppUrl'] ]
        staticWebAppToken: $[ dependencies.Deploy_Infra.outputs['Deploy_Infra.staticWebAppToken'] ]
      pool:
        vmImage: ubuntu-latest
      steps:
        - task: AzureCLI@2
          displayName: 'Download UI artifact from storage'
          inputs:
            azureSubscription: '${{ parameters.azureServiceConnection }}'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              key=$(az storage account keys list -g "${{ parameters.resourceGroupName }}" -n "${{ parameters.storageAccountName }}" --query "[0].value" -o tsv)
              if [ -z "$key" ]; then
                echo "##vso[task.logissue type=error]No storage key found for ${{ parameters.storageAccountName }}"
                exit 1
              fi

              container="${{ parameters.artifactContainerName }}"
              blob_path="swa/${{ parameters.artifactBuildId }}.zip"
              dest="$BUILD_ARTIFACTSTAGINGDIRECTORY/swa.zip"

              az storage blob download --account-name "${{ parameters.storageAccountName }}" --account-key "$key" \
                --container-name "$container" --name "$blob_path" --file "$dest" --auth-mode key

              if [ ! -f "$dest" ]; then
                echo "##vso[task.logissue type=error]Failed to download SWA artifact: $blob_path"
                exit 1
              fi

              mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY/swa-content"
              unzip -q "$dest" -d "$BUILD_ARTIFACTSTAGINGDIRECTORY/swa-content"
              echo "[CD] Downloaded and extracted SWA artifact"

        - task: AzureStaticWebApp@0
          displayName: Deploy Static Web App content
          inputs:
            azure_static_web_apps_api_token: '$(staticWebAppToken)'
            workingDirectory: '$(BUILD_ARTIFACTSTAGINGDIRECTORY)'
            app_location: 'swa-content'
            api_location: ''
            output_location: ''
            skip_app_build: true
            skip_api_build: true
