# Reusable job template for building a Function App
# Used by: ci-functions.yml (unified CI pipeline)

parameters:
  - name: functionName
    type: string
  - name: functionDir
    type: string
  - name: sharedDir
    type: string
  - name: pythonVersion
    type: string
    default: '3.13'
  - name: condition
    type: string
    default: 'succeeded()'

jobs:
  - job: Build_${{ replace(parameters.functionName, '-', '_') }}
    displayName: 'Build ${{ parameters.functionName }}'
    condition: ${{ parameters.condition }}
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        displayName: 'Use Python ${{ parameters.pythonVersion }}'
        inputs:
          versionSpec: '${{ parameters.pythonVersion }}'

      # Compute stable hashes for cache keys (requirements + shared code)
      - bash: |
          set -euo pipefail

          req_file="$(Build.SourcesDirectory)/${{ parameters.functionDir }}/requirements.txt"
          shared_dir="$(Build.SourcesDirectory)/${{ parameters.sharedDir }}"

          if [ ! -f "$req_file" ]; then
            echo "##vso[task.logissue type=error]requirements.txt not found: $req_file"
            exit 1
          fi
          if [ ! -d "$shared_dir" ]; then
            echo "##vso[task.logissue type=error]Shared directory not found: $shared_dir"
            exit 1
          fi

          req_hash="$(sha256sum "$req_file" | awk '{print $1}')"

          # Hash shared directory content deterministically
          shared_hash="$(
            (cd "$shared_dir" && \
              find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            | sha256sum | awk '{print $1}'
          )"

          echo "Req hash: $req_hash"
          echo "Shared hash: $shared_hash"

          echo "##vso[task.setvariable variable=ReqHash]$req_hash"
          echo "##vso[task.setvariable variable=SharedHash]$shared_hash"
        displayName: 'Compute dependency cache keys'

      # Cache pip download artifacts (wheels/sdists)
      - task: Cache@2
        displayName: 'Cache pip downloads'
        inputs:
          key: 'pip | "$(Agent.OS)" | "${{ parameters.pythonVersion }}"'
          restoreKeys: |
            pip | "$(Agent.OS)"
          path: '$(Pipeline.Workspace)/.pip'

      # Cache the installed dependency layer for this function (including installed shared package)
      - task: Cache@2
        displayName: 'Cache function dependencies (.python_packages)'
        inputs:
          key: 'deps | "$(Agent.OS)" | "${{ parameters.pythonVersion }}" | "${{ parameters.functionName }}" | $(ReqHash) | $(SharedHash)'
          path: '$(Build.SourcesDirectory)/${{ parameters.functionDir }}/.python_packages'
          cacheHitVar: 'DEPS_CACHE_HIT'

      - script: |
          set -euo pipefail

          export PIP_CACHE_DIR="$(Pipeline.Workspace)/.pip"

          dir="${{ parameters.functionDir }}"
          shared="${{ parameters.sharedDir }}"
          artifact="$BUILD_ARTIFACTSTAGINGDIRECTORY/${{ parameters.functionName }}.zip"
          site_packages="$dir/.python_packages/lib/site-packages"

          if [ ! -d "$dir" ]; then
            echo "##vso[task.logissue type=error]Function directory not found: $dir"
            exit 1
          fi

          echo "[CI] Packaging function: ${{ parameters.functionName }}"
          echo "[CI] PIP_CACHE_DIR: $PIP_CACHE_DIR"
          echo "[CI] Dependency cache hit? $(DEPS_CACHE_HIT)"

          # Only (re)install deps when cache missed or site-packages is absent
          if [ "$(DEPS_CACHE_HIT)" != "true" ] || [ ! -d "$site_packages" ]; then
            echo "[CI] Installing dependencies (cache miss or missing site-packages)"
            rm -rf "$site_packages"
            mkdir -p "$site_packages"

            python -m pip install --upgrade pip
            python -m pip install -r "$dir/requirements.txt" --target "$site_packages"
            python -m pip install "$shared" --target "$site_packages"
          else
            echo "[CI] Skipping dependency install (cache hit)"
          fi

          (cd "$dir" && zip -r "$artifact" . \
            -x "**/__pycache__/**" \
            -x "**/*.pyc" \
            -x "**/.venv/**" \
            -x "**/.pytest_cache/**" \
            -x "**/.git/**" \
            -x "**/.DS_Store")

          echo "[CI] Created artifact: $artifact"
        displayName: 'Package ${{ parameters.functionName }}'

      - bash: |
          echo "[CI] Publishing artifact with name: ${{ parameters.functionName }}-$(Build.BuildId)"
          echo "[CI] Build ID: $(Build.BuildId)"
          echo "[CI] Artifact zip path: $(Build.ArtifactStagingDirectory)/${{ parameters.functionName }}.zip"
        displayName: 'Log artifact publishing details'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish ${{ parameters.functionName }} artifact'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.functionName }}.zip'
          artifact: '$(Build.BuildId)-${{ parameters.functionName }}'
          publishLocation: 'pipeline'
